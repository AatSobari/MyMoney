<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYMONEY</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    /* === SISTEM DEFAULT === */
    * {
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      color: #00ff41;
      border: 1.5px solid #00ff41;
      border-radius: 4px;
      text-transform: uppercase;
    }
    html, body {
      background: #000;
      background-color: #000;
      border: none;
      border-radius: 0;
    }
    body {
      margin: 10px;
      width: calc(100% - 20px);
      background: black;
      background-color: black;
      border: none;
      border-radius: 0;
    }
    .title {
      text-align: center;
      margin-top: 10px;
      border: none;
      border-radius: 0;
      font-size: 18px;
      letter-spacing: 3px;
    }
    .kolom-container {
      margin: 15px 2.5px 0px 2.5px;
      display: flex;
      gap: 5px;
      border: none;
      border-radius: 0;
    }
    .kolom {
      display: inline-block;
      flex: 1;
      padding: 6px 8px;
      background: rgba(0, 255, 65, 0.03);
    }
    .kolom-judul {
      text-align: left;
      border: none;
      border-radius: 0;
      margin-bottom: 4px;
    }
    .kolom-judul.masuk { color: #00ff41; }
    .kolom-judul.tabung { color: #ffffff; }
    .kolom-judul.keluar { color: #ff3131; }
    .kolom-isi {
      text-align: left;
      font-size: 10px;
      border: none;
      border-radius: 0;
    }
    .kolom-isi.masuk { color: #00ff41; }
    .kolom-isi.tabung { color: #ffffff; }
    .kolom-isi.keluar { color: #ff3131; }

    .transaksi-section {
      margin: 15px 2.5px 0px 2.5px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .transaksi-title {
      text-align: left;
      border: none;
      border-radius: 0;
    }
    .btn-group {
      display: flex;
      gap: 5px;
      border: none;
      border-radius: 0;
    }
    .btn {
      flex: 1;
      padding: 8px 10px;
      background: transparent;
      text-align: center;
      cursor: pointer;
    }
    .btn-masuk { border: 1.5px solid #00ff41 !important; color: #00ff41 !important; }
    .btn-tabung { border: 1.5px solid #ffffff !important; color: #ffffff !important; }
    .btn-keluar { border: 1.5px solid #ff3131 !important; color: #ff3131 !important; }

    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      border: none;
      border-radius: 0;
      padding: 20px;
    }
    .popup-overlay.active { display: flex; }
    .popup-box {
      width: 100%;
      max-width: 320px;
      background: #000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .popup-box.masuk-box { border: 1.5px solid #00ff41 !important; }
    .popup-box.tabung-box { border: 1.5px solid #ffffff !important; }
    .popup-box.keluar-box { border: 1.5px solid #ff3131 !important; }
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: none;
      border-radius: 0;
    }
    .popup-title { border: none; border-radius: 0; }
    .popup-close { border: none !important; background: transparent; cursor: pointer; }
    .popup-input {
      width: 100%;
      padding: 8px 10px;
      background: transparent;
      outline: none;
    }

    .grafik-section {
      margin: 15px 2.5px 0px 2.5px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .grafik-title {
      text-align: left;
      border: none;
      border-radius: 0;
    }
    .grafik-wrapper {
      display: flex;
      border: none;
      border-radius: 0;
      height: 200px;
      gap: 0;
    }
    .y-axis {
      width: 38px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      border: none;
      border-radius: 0;
      padding-right: 4px;
    }
    .y-label {
      font-size: 7px;
      line-height: 1;
      border: none;
      border-radius: 0;
      color: #00ff41;
      text-align: right;
      width: 100%;
    }
    .chart-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: none;
      border-radius: 0;
      border-left: 1.5px solid #00ff41 !important;
      border-bottom: 1.5px solid #00ff41 !important;
      box-sizing: border-box;
    }
    .bars-container {
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 0;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .day-group {
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 0;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      height: 100%;
      box-sizing: border-box;
    }
    .bar {
      flex: 1;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      box-sizing: border-box;
      min-width: 1px;
    }
    .bar.masuk { background: #00ff41; }
    .bar.tabung { background: #ffffff; }
    .bar.keluar { background: #ff3131; }
    .x-axis {
      display: flex;
      width: 100%;
      height: 14px;
      border: none;
      border-radius: 0;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .x-label {
      flex: 1;
      font-size: 6px;
      text-align: center;
      border: none;
      border-radius: 0;
      overflow: hidden;
      white-space: nowrap;
      color: #00ff41;
    }

    .barang-section {
      margin: 15px 2.5px 0px 2.5px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .barang-title {
      text-align: left;
      border: none;
      border-radius: 0;
    }
    .barang-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      border: none;
      border-radius: 0;
    }
    .barang-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
    }
    .barang-nama {
      text-align: left;
      border: none;
      border-radius: 0;
      flex: 1;
    }
    .barang-total {
      text-align: right;
      border: none;
      border-radius: 0;
      font-size: 10px;
    }
    .status-offline {
      margin: 15px 2.5px 0px 2.5px;
      padding: 6px 8px;
      text-align: center;
      font-size: 9px;
      border: 1.5px solid #ffffff !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <h1 class="title">MYMONEY</h1>

  <div class="kolom-container">
    <div class="kolom">
      <div class="kolom-judul masuk">MASUK</div>
      <div class="kolom-isi masuk" id="DISPLAY-MASUK">RP. 0.00</div>
    </div>
    <div class="kolom">
      <div class="kolom-judul tabung">TABUNG</div>
      <div class="kolom-isi tabung" id="DISPLAY-TABUNG">RP. 0.00</div>
    </div>
    <div class="kolom">
      <div class="kolom-judul keluar">KELUAR</div>
      <div class="kolom-isi keluar" id="DISPLAY-KELUAR">RP. 0.00</div>
    </div>
  </div>

  <div class="transaksi-section">
    <div class="transaksi-title">TRANSAKSI</div>
    <div class="btn-group">
      <button class="btn btn-masuk" onclick="OPENPOPUP('MASUK')">MASUK</button>
      <button class="btn btn-tabung" onclick="OPENPOPUP('TABUNG')">TABUNG</button>
      <button class="btn btn-keluar" onclick="OPENPOPUP('KELUAR')">KELUAR</button>
    </div>
  </div>

  <div class="grafik-section">
    <div class="grafik-title">GRAFIK BATANG (100 HARI MAX, 12 TINGKAT)</div>
    <div class="grafik-wrapper">
      <div class="y-axis" id="Y-AXIS"></div>
      <div class="chart-area">
        <div class="bars-container" id="BARS-CONTAINER"></div>
        <div class="x-axis" id="X-AXIS"></div>
      </div>
    </div>
  </div>

  <div class="barang-section" id="BARANG-SECTION" style="display:none;">
    <div class="barang-title">TOTAL BARANG</div>
    <div class="barang-list" id="BARANG-LIST"></div>
  </div>

  <div class="status-offline" id="OFFLINE-STATUS">OFFLINE READY - DATA TERSIMPAN DI LOCAL STORAGE</div>

  <!-- POPUP MASUK -->
  <div id="POPUP-MASUK" class="popup-overlay">
    <div class="popup-box masuk-box">
      <div class="popup-header">
        <div class="popup-title" style="color:#00ff41; border:none;">MASUK</div>
        <button class="popup-close" onclick="CLOSEPOPUP('MASUK')" style="color:#00ff41;">X</button>
      </div>
      <input type="text" id="MASUK-HASIL" class="popup-input" placeholder="HASIL" style="border:1.5px solid #00ff41; color:#00ff41;">
      <input type="number" id="MASUK-RP" class="popup-input" placeholder="RP." style="border:1.5px solid #00ff41; color:#00ff41;">
      <button class="popup-input" onclick="DOMASUK()" style="border:1.5px solid #00ff41; color:#00ff41; text-align:center;">TAMBAH</button>
    </div>
  </div>

  <!-- POPUP TABUNG -->
  <div id="POPUP-TABUNG" class="popup-overlay">
    <div class="popup-box tabung-box">
      <div class="popup-header">
        <div class="popup-title" style="color:#ffffff; border:none;">TABUNG</div>
        <button class="popup-close" onclick="CLOSEPOPUP('TABUNG')" style="color:#ffffff;">X</button>
      </div>
      <input type="number" id="TABUNG-RP" class="popup-input" placeholder="RP." style="border:1.5px solid #ffffff; color:#ffffff;">
      <button class="popup-input" onclick="DOTABUNG()" style="border:1.5px solid #ffffff; color:#ffffff; text-align:center;">NABUNG</button>
    </div>
  </div>

  <!-- POPUP KELUAR -->
  <div id="POPUP-KELUAR" class="popup-overlay">
    <div class="popup-box keluar-box">
      <div class="popup-header">
        <div class="popup-title" style="color:#ff3131; border:none;">KELUAR</div>
        <button class="popup-close" onclick="CLOSEPOPUP('KELUAR')" style="color:#ff3131;">X</button>
      </div>
      <input type="text" id="KELUAR-UNTUK" class="popup-input" placeholder="UNTUK" style="border:1.5px solid #ff3131; color:#ff3131;">
      <input type="number" id="KELUAR-RP" class="popup-input" placeholder="RP." style="border:1.5px solid #ff3131; color:#ff3131;">
      <button class="popup-input" onclick="DOKELUAR()" style="border:1.5px solid #ff3131; color:#ff3131; text-align:center;">KURANG</button>
    </div>
  </div>

  <script>
    // === STATE ===
    let TOTALS = { MASUK: 0, TABUNG: 0, KELUAR: 0 };
    let BARANGMAP = {};
    let CHARTDATA = [];

    // === LOCAL STORAGE ===
    function LOADSTORAGE(){
      try{
        let t = localStorage.getItem('MYMONEY_TOTALS');
        let b = localStorage.getItem('MYMONEY_BARANG');
        let c = localStorage.getItem('MYMONEY_CHART');
        if(t) TOTALS = JSON.parse(t);
        if(b) BARANGMAP = JSON.parse(b);
        if(c) CHARTDATA = JSON.parse(c);
      }catch(e){ console.error('LOAD ERROR', e); }
    }
    function SAVESTORAGE(){
      try{
        localStorage.setItem('MYMONEY_TOTALS', JSON.stringify(TOTALS));
        localStorage.setItem('MYMONEY_BARANG', JSON.stringify(BARANGMAP));
        localStorage.setItem('MYMONEY_CHART', JSON.stringify(CHARTDATA));
      }catch(e){ console.error('SAVE ERROR', e); }
    }

    // === FORMAT ===
    function FORMATRP(n){
      return 'RP. ' + n.toLocaleString('ID-ID') + '.00';
    }
    function NICESTEP(max, levels){
      if(max <= 0) return 1;
      let raw = max / levels;
      let mag = Math.pow(10, Math.floor(Math.log10(raw)));
      let norm = raw / mag;
      let nice;
      if(norm <= 1) nice = 1;
      else if(norm <= 2) nice = 2;
      else if(norm <= 5) nice = 5;
      else nice = 10;
      return nice * mag;
    }

    // === RENDER ===
    function RENDERTOTALS(){
      let elM = document.getElementById('DISPLAY-MASUK');
      let elT = document.getElementById('DISPLAY-TABUNG');
      let elK = document.getElementById('DISPLAY-KELUAR');
      if(elM) elM.textContent = FORMATRP(TOTALS.MASUK);
      if(elT) elT.textContent = FORMATRP(TOTALS.TABUNG);
      if(elK) elK.textContent = FORMATRP(TOTALS.KELUAR);
    }
    function RENDERBARANG(){
      const section = document.getElementById('BARANG-SECTION');
      const list = document.getElementById('BARANG-LIST');
      if(!section || !list) return;
      list.innerHTML = '';
      const keys = Object.keys(BARANGMAP);
      if(keys.length === 0){ section.style.display = 'none'; return; }
      section.style.display = 'flex';
      keys.forEach(nama=>{
        let item = document.createElement('div');
        item.className = 'barang-item';
        let namaDiv = document.createElement('div');
        namaDiv.className = 'barang-nama';
        namaDiv.textContent = nama.toUpperCase();
        let totalDiv = document.createElement('div');
        totalDiv.className = 'barang-total';
        let col = '#00ff41';
        // warna total sesuai barang ada di keluar atau masuk
        if(BARANGMAP[nama] < 0) col = '#ff3131';
        totalDiv.style.color = col;
        totalDiv.textContent = FORMATRP(BARANGMAP[nama]);
        item.appendChild(namaDiv);
        item.appendChild(totalDiv);
        list.appendChild(item);
      });
    }
    function RENDERGRAFIK(){
      const bars = document.getElementById('BARS-CONTAINER');
      const yAxis = document.getElementById('Y-AXIS');
      const xAxis = document.getElementById('X-AXIS');
      if(!bars || !yAxis || !xAxis) return;
      bars.innerHTML = '';
      yAxis.innerHTML = '';
      xAxis.innerHTML = '';
      if(CHARTDATA.length > 100) CHARTDATA = CHARTDATA.slice(-100);
      let maxVal = 0;
      CHARTDATA.forEach(d=>{ maxVal = Math.max(maxVal, d.MASUK, d.TABUNG, d.KELUAR); });
      const LEVELS = 12;
      let step = NICESTEP(maxVal, LEVELS);
      if(maxVal === 0){ step = 1; }
      let maxY = step * LEVELS;
      if(maxY < maxVal) maxY = Math.ceil(maxVal / step) * step;
      if(maxY === 0) maxY = 12;
      for(let i = LEVELS; i >= 1; i--){
        let v = i * step;
        let label = document.createElement('div');
        label.className = 'y-label';
        label.textContent = v >= 1000 ? (v/1000)+'K' : v;
        yAxis.appendChild(label);
      }
      CHARTDATA.forEach((d)=>{
        let dayGroup = document.createElement('div');
        dayGroup.className = 'day-group';
        let bMasuk = document.createElement('div');
        bMasuk.className = 'bar masuk';
        bMasuk.style.height = (d.MASUK / maxY * 100) + '%';
        let bTabung = document.createElement('div');
        bTabung.className = 'bar tabung';
        bTabung.style.height = (d.TABUNG / maxY * 100) + '%';
        let bKeluar = document.createElement('div');
        bKeluar.className = 'bar keluar';
        bKeluar.style.height = (d.KELUAR / maxY * 100) + '%';
        dayGroup.appendChild(bMasuk);
        dayGroup.appendChild(bTabung);
        dayGroup.appendChild(bKeluar);
        bars.appendChild(dayGroup);
        let xLabel = document.createElement('div');
        xLabel.className = 'x-label';
        xLabel.textContent = d.HARI;
        xAxis.appendChild(xLabel);
      });
    }

    // === POPUP ===
    function OPENPOPUP(t){ 
      let el = document.getElementById('POPUP-'+t);
      if(el) el.classList.add('active');
    }
    function CLOSEPOPUP(t){
      let el = document.getElementById('POPUP-'+t);
      if(el) el.classList.remove('active');
    }
    document.querySelectorAll('.popup-overlay').forEach(o=>{
      o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('active'); });
    });

    // === ACTIONS ===
    function DOMASUK(){
      let hasilEl = document.getElementById('MASUK-HASIL');
      let rpEl = document.getElementById('MASUK-RP');
      if(!hasilEl || !rpEl) return;
      let hasil = hasilEl.value.trim().toUpperCase() || 'TANPA NAMA';
      let rp = parseInt(rpEl.value) || 0;
      if(rp <= 0){ alert('RP. HARUS DIISI > 0'); return; }
      TOTALS.MASUK += rp;
      BARANGMAP[hasil] = (BARANGMAP[hasil] || 0) + rp;
      let nextHari = CHARTDATA.length ? CHARTDATA[CHARTDATA.length-1].HARI + 1 : 1;
      CHARTDATA.push({ HARI: nextHari, MASUK: rp, TABUNG: 0, KELUAR: 0 });
      if(CHARTDATA.length > 100) CHARTDATA.shift();
      SAVESTORAGE();
      RENDERTOTALS();
      RENDERBARANG();
      RENDERGRAFIK();
      hasilEl.value = '';
      rpEl.value = '';
      CLOSEPOPUP('MASUK');
    }
    function DOTABUNG(){
      let rpEl = document.getElementById('TABUNG-RP');
      if(!rpEl) return;
      let rp = parseInt(rpEl.value) || 0;
      if(rp <= 0){ alert('RP. HARUS DIISI'); return; }
      if(rp > TOTALS.MASUK){ alert('SALDO MASUK TIDAK CUKUP'); return; }
      TOTALS.MASUK -= rp;
      TOTALS.TABUNG += rp;
      let nextHari = CHARTDATA.length ? CHARTDATA[CHARTDATA.length-1].HARI + 1 : 1;
      CHARTDATA.push({ HARI: nextHari, MASUK: 0, TABUNG: rp, KELUAR: 0 });
      if(CHARTDATA.length > 100) CHARTDATA.shift();
      SAVESTORAGE();
      RENDERTOTALS();
      RENDERGRAFIK();
      rpEl.value = '';
      CLOSEPOPUP('TABUNG');
    }
    function DOKELUAR(){
      let untukEl = document.getElementById('KELUAR-UNTUK');
      let rpEl = document.getElementById('KELUAR-RP');
      if(!untukEl || !rpEl) return;
      let untuk = untukEl.value.trim().toUpperCase() || 'TANPA NAMA';
      let rp = parseInt(rpEl.value) || 0;
      if(rp <= 0){ alert('RP. HARUS DIISI'); return; }
      if(rp > TOTALS.MASUK){ alert('SALDO MASUK TIDAK CUKUP'); return; }
      TOTALS.MASUK -= rp;
      TOTALS.KELUAR += rp;
      BARANGMAP[untuk] = (BARANGMAP[untuk] || 0) + rp;
      let nextHari = CHARTDATA.length ? CHARTDATA[CHARTDATA.length-1].HARI + 1 : 1;
      CHARTDATA.push({ HARI: nextHari, MASUK: 0, TABUNG: 0, KELUAR: rp });
      if(CHARTDATA.length > 100) CHARTDATA.shift();
      SAVESTORAGE();
      RENDERTOTALS();
      RENDERBARANG();
      RENDERGRAFIK();
      untukEl.value = '';
      rpEl.value = '';
      CLOSEPOPUP('KELUAR');
    }

    // === INIT ===
    window.addEventListener('load', ()=>{
      LOADSTORAGE();
      RENDERTOTALS();
      RENDERBARANG();
      RENDERGRAFIK();
      // OFFLINE CHECK
      let status = document.getElementById('OFFLINE-STATUS');
      if(status){
        if(navigator.onLine) status.textContent = 'ONLINE - DATA OTOMATIS TERSIMPAN DI LOCAL STORAGE';
        else status.textContent = 'OFFLINE MODE - DATA TETAP TERSIMPAN';
      }
      window.addEventListener('online', ()=>{ if(status) status.textContent = 'ONLINE KEMBALI - DATA AMAN'; });
      window.addEventListener('offline', ()=>{ if(status) status.textContent = 'OFFLINE MODE - TETAP BISA DIPAKAI'; });
      // REGISTER SW
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('sw.js').then(()=>{ console.log('SW OK'); }).catch(e=>{ console.log('SW FAIL', e); });
      }
    });
  </script>
</body>
</html>
