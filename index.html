<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYMONEY</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#000000">
  <style>
    * {
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      color: #00ff41;
      border: 1.5px solid #00ff41;
      border-radius: 4px;
      text-transform: uppercase;
    }
    html, body { background: #000; background-color: #000; border: none; border-radius: 0; }
    body { margin: 10px; width: calc(100% - 20px); background: black; background-color: black; border: none; }
    .title { text-align: center; margin-top: 10px; border: none; font-size: 18px; letter-spacing: 3px; }
    .kolom-container { margin: 15px 2.5px 0px 2.5px; display: flex; gap: 5px; border: none; }
    .kolom { flex: 1; padding: 6px 8px; background: rgba(0, 255, 65, 0.03); }
    .kolom-judul { text-align: left; border: none; margin-bottom: 4px; }
    .kolom-judul.masuk { color: #00ff41; }
    .kolom-judul.tabung { color: #ffffff; }
    .kolom-judul.keluar { color: #ff3131; }
    .kolom-isi { text-align: left; font-size: 10px; border: none; }
    .kolom-isi.masuk { color: #00ff41; }
    .kolom-isi.tabung { color: #ffffff; }
    .kolom-isi.keluar { color: #ff3131; }
    .transaksi-section { margin: 15px 2.5px 0px 2.5px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .transaksi-title { text-align: left; border: none; }
    .btn-group { display: flex; gap: 5px; border: none; }
    .btn { flex: 1; padding: 8px 10px; background: transparent; text-align: center; cursor: pointer; }
    .btn-masuk { border: 1.5px solid #00ff41 !important; color: #00ff41 !important; }
    .btn-tabung { border: 1.5px solid #ffffff !important; color: #ffffff !important; }
    .btn-keluar { border: 1.5px solid #ff3131 !important; color: #ff3131 !important; }
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 999; border: none; padding: 20px; }
    .popup-overlay.active { display: flex; }
    .popup-box { width: 100%; max-width: 320px; background: #000; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .popup-box.masuk-box { border: 1.5px solid #00ff41 !important; }
    .popup-box.tabung-box { border: 1.5px solid #ffffff !important; }
    .popup-box.keluar-box { border: 1.5px solid #ff3131 !important; }
    .popup-header { display: flex; justify-content: space-between; align-items: center; border: none; }
    .popup-title { border: none; }
    .popup-close { border: none !important; background: transparent; cursor: pointer; }
    .popup-input { width: 100%; padding: 8px 10px; background: transparent; outline: none; }
    .grafik-section { margin: 15px 2.5px 0px 2.5px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .grafik-title { text-align: left; border: none; }
    .grafik-wrapper { display: flex; border: none; height: 200px; gap: 0; }
    .y-axis { width: 38px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; border: none; padding-right: 4px; }
    .y-label { font-size: 7px; line-height: 1; border: none; color: #00ff41; text-align: right; width: 100%; }
    .chart-area { flex: 1; display: flex; flex-direction: column; border: none; border-left: 1.5px solid #00ff41 !important; border-bottom: 1.5px solid #00ff41 !important; box-sizing: border-box; }
    .bars-container { flex: 1; display: flex; align-items: flex-end; gap: 0; margin: 0; padding: 0; border: none; width: 100%; box-sizing: border-box; overflow: hidden; }
    .day-group { flex: 1; display: flex; align-items: flex-end; gap: 0; margin: 0; padding: 0; border: none; height: 100%; box-sizing: border-box; }
    .bar { flex: 1; margin: 0; padding: 0; border: none; border-radius: 0; box-sizing: border-box; min-width: 1px; }
    .bar.masuk { background: #00ff41; }
    .bar.tabung { background: #ffffff; }
    .bar.keluar { background: #ff3131; }
    .x-axis { display: flex; width: 100%; height: 14px; border: none; margin: 0; padding: 0; box-sizing: border-box; }
    .x-label { flex: 1; font-size: 6px; text-align: center; border: none; overflow: hidden; white-space: nowrap; color: #00ff41; }
    .barang-section { margin: 15px 2.5px 0px 2.5px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .barang-title { text-align: left; border: none; }
    .barang-list { display: flex; flex-direction: column; gap: 5px; border: none; }
    .barang-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; }
    .barang-nama { text-align: left; border: none; flex: 1; }
    .barang-total { text-align: right; border: none; font-size: 10px; }
    .status-offline { margin: 15px 2.5px 0px 2.5px; padding: 6px 8px; text-align: center; font-size: 9px; border: 1.5px solid #ffffff !important; color: #ffffff !important; }
  </style>
</head>
<body>
  <h1 class="title">MYMONEY</h1>
  <div class="kolom-container">
    <div class="kolom"><div class="kolom-judul masuk">MASUK</div><div class="kolom-isi masuk" id="DISPLAY-MASUK">RP. 0.00</div></div>
    <div class="kolom"><div class="kolom-judul tabung">TABUNG</div><div class="kolom-isi tabung" id="DISPLAY-TABUNG">RP. 0.00</div></div>
    <div class="kolom"><div class="kolom-judul keluar">KELUAR</div><div class="kolom-isi keluar" id="DISPLAY-KELUAR">RP. 0.00</div></div>
  </div>
  <div class="transaksi-section"><div class="transaksi-title">TRANSAKSI</div><div class="btn-group">
    <button class="btn btn-masuk" onclick="OPENPOPUP('MASUK')">MASUK</button>
    <button class="btn btn-tabung" onclick="OPENPOPUP('TABUNG')">TABUNG</button>
    <button class="btn btn-keluar" onclick="OPENPOPUP('KELUAR')">KELUAR</button>
  </div></div>
  <div class="grafik-section"><div class="grafik-title">GRAFIK BATANG (100 HARI MAX, 12 TINGKAT)</div><div class="grafik-wrapper"><div class="y-axis" id="Y-AXIS"></div><div class="chart-area"><div class="bars-container" id="BARS-CONTAINER"></div><div class="x-axis" id="X-AXIS"></div></div></div></div>
  <div class="barang-section" id="BARANG-SECTION" style="display:none;"><div class="barang-title">TOTAL BARANG</div><div class="barang-list" id="BARANG-LIST"></div></div>
  <div class="status-offline" id="OFFLINE-STATUS">OFFLINE READY - DATA TERSIMPAN DI LOCAL STORAGE</div>

  <div id="POPUP-MASUK" class="popup-overlay"><div class="popup-box masuk-box"><div class="popup-header"><div class="popup-title" style="color:#00ff41; border:none;">MASUK</div><button class="popup-close" onclick="CLOSEPOPUP('MASUK')" style="color:#00ff41;">X</button></div><input type="text" id="MASUK-HASIL" class="popup-input" placeholder="HASIL" style="border:1.5px solid #00ff41; color:#00ff41;"><input type="number" id="MASUK-RP" class="popup-input" placeholder="RP." style="border:1.5px solid #00ff41; color:#00ff41;"><button class="popup-input" onclick="DOMASUK()" style="border:1.5px solid #00ff41; color:#00ff41; text-align:center;">TAMBAH</button></div></div>
  <div id="POPUP-TABUNG" class="popup-overlay"><div class="popup-box tabung-box"><div class="popup-header"><div class="popup-title" style="color:#ffffff; border:none;">TABUNG</div><button class="popup-close" onclick="CLOSEPOPUP('TABUNG')" style="color:#ffffff;">X</button></div><input type="number" id="TABUNG-RP" class="popup-input" placeholder="RP." style="border:1.5px solid #ffffff; color:#ffffff;"><button class="popup-input" onclick="DOTABUNG()" style="border:1.5px solid #ffffff; color:#ffffff; text-align:center;">NABUNG</button></div></div>
  <div id="POPUP-KELUAR" class="popup-overlay"><div class="popup-box keluar-box"><div class="popup-header"><div class="popup-title" style="color:#ff3131; border:none;">KELUAR</div><button class="popup-close" onclick="CLOSEPOPUP('KELUAR')" style="color:#ff3131;">X</button></div><input type="text" id="KELUAR-UNTUK" class="popup-input" placeholder="UNTUK" style="border:1.5px solid #ff3131; color:#ff3131;"><input type="number" id="KELUAR-RP" class="popup-input" placeholder="RP." style="border:1.5px solid #ff3131; color:#ff3131;"><button class="popup-input" onclick="DOKELUAR()" style="border:1.5px solid #ff3131; color:#ff3131; text-align:center;">KURANG</button></div></div>

  <script>
    let TOTALS = { MASUK: 0, TABUNG: 0, KELUAR: 0 };
    let BARANGMAP = {};
    let CHARTDATA = [];
    function LOADSTORAGE(){ try{ let t=localStorage.getItem('MYMONEY_TOTALS'); let b=localStorage.getItem('MYMONEY_BARANG'); let c=localStorage.getItem('MYMONEY_CHART'); if(t) TOTALS=JSON.parse(t); if(b) BARANGMAP=JSON.parse(b); if(c) CHARTDATA=JSON.parse(c);}catch(e){} }
    function SAVESTORAGE(){ try{ localStorage.setItem('MYMONEY_TOTALS', JSON.stringify(TOTALS)); localStorage.setItem('MYMONEY_BARANG', JSON.stringify(BARANGMAP)); localStorage.setItem('MYMONEY_CHART', JSON.stringify(CHARTDATA)); }catch(e){} }
    function FORMATRP(n){ return 'RP. ' + n.toLocaleString('id-ID') + '.00'; }
    function NICESTEP(max, levels){ if(max<=0) return 1; let raw=max/levels; let mag=Math.pow(10, Math.floor(Math.log10(raw))); let norm=raw/mag; let nice; if(norm<=1) nice=1; else if(norm<=2) nice=2; else if(norm<=5) nice=5; else nice=10; return nice*mag; }
    function RENDERTOTALS(){ let a=document.getElementById('DISPLAY-MASUK'); let b=document.getElementById('DISPLAY-TABUNG'); let c=document.getElementById('DISPLAY-KELUAR'); if(a) a.textContent=FORMATRP(TOTALS.MASUK); if(b) b.textContent=FORMATRP(TOTALS.TABUNG); if(c) c.textContent=FORMATRP(TOTALS.KELUAR); }
    function RENDERBARANG(){ const s=document.getElementById('BARANG-SECTION'); const l=document.getElementById('BARANG-LIST'); if(!s||!l) return; l.innerHTML=''; const keys=Object.keys(BARANGMAP); if(keys.length===0){ s.style.display='none'; return;} s.style.display='flex'; keys.forEach(n=>{ let it=document.createElement('div'); it.className='barang-item'; let n1=document.createElement('div'); n1.className='barang-nama'; n1.textContent=n.toUpperCase(); let t1=document.createElement('div'); t1.className='barang-total'; t1.textContent=FORMATRP(BARANGMAP[n]); it.appendChild(n1); it.appendChild(t1); l.appendChild(it); }); }
    function RENDERGRAFIK(){ const bars=document.getElementById('BARS-CONTAINER'); const yAxis=document.getElementById('Y-AXIS'); const xAxis=document.getElementById('X-AXIS'); if(!bars||!yAxis||!xAxis) return; bars.innerHTML=''; yAxis.innerHTML=''; xAxis.innerHTML=''; if(CHARTDATA.length>100) CHARTDATA=CHARTDATA.slice(-100); let maxVal=0; CHARTDATA.forEach(d=>{ maxVal=Math.max(maxVal, d.MASUK, d.TABUNG, d.KELUAR); }); const LEVELS=12; let step=NICESTEP(maxVal, LEVELS); if(maxVal===0) step=1; let maxY=step*LEVELS; if(maxY<maxVal) maxY=Math.ceil(maxVal/step)*step; if(maxY===0) maxY=12; for(let i=LEVELS;i>=1;i--){ let v=i*step; let label=document.createElement('div'); label.className='y-label'; label.textContent=v>=1000?(v/1000)+'K':v; yAxis.appendChild(label);} CHARTDATA.forEach(d=>{ let dg=document.createElement('div'); dg.className='day-group'; let bm=document.createElement('div'); bm.className='bar masuk'; bm.style.height=(d.MASUK/maxY*100)+'%'; let bt=document.createElement('div'); bt.className='bar tabung'; bt.style.height=(d.TABUNG/maxY*100)+'%'; let bk=document.createElement('div'); bk.className='bar keluar'; bk.style.height=(d.KELUAR/maxY*100)+'%'; dg.appendChild(bm); dg.appendChild(bt); dg.appendChild(bk); bars.appendChild(dg); let xl=document.createElement('div'); xl.className='x-label'; xl.textContent=d.HARI; xAxis.appendChild(xl); }); }
    function OPENPOPUP(t){ let el=document.getElementById('POPUP-'+t); if(el) el.classList.add('active'); }
    function CLOSEPOPUP(t){ let el=document.getElementById('POPUP-'+t); if(el) el.classList.remove('active'); }
    document.querySelectorAll('.popup-overlay').forEach(o=>{ o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('active'); }); });
    function DOMASUK(){ let h=document.getElementById('MASUK-HASIL'); let r=document.getElementById('MASUK-RP'); if(!h||!r) return; let hasil=h.value.trim().toUpperCase()||'TANPA NAMA'; let rp=parseInt(r.value)||0; if(rp<=0){ alert('RP. HARUS DIISI > 0'); return;} TOTALS.MASUK+=rp; BARANGMAP[hasil]=(BARANGMAP[hasil]||0)+rp; let nh=CHARTDATA.length?CHARTDATA[CHARTDATA.length-1].HARI+1:1; CHARTDATA.push({HARI:nh, MASUK:rp, TABUNG:0, KELUAR:0}); if(CHARTDATA.length>100) CHARTDATA.shift(); SAVESTORAGE(); RENDERTOTALS(); RENDERBARANG(); RENDERGRAFIK(); h.value=''; r.value=''; CLOSEPOPUP('MASUK'); }
    function DOTABUNG(){ let r=document.getElementById('TABUNG-RP'); if(!r) return; let rp=parseInt(r.value)||0; if(rp<=0){ alert('RP. HARUS DIISI'); return;} if(rp>TOTALS.MASUK){ alert('SALDO MASUK TIDAK CUKUP'); return;} TOTALS.MASUK-=rp; TOTALS.TABUNG+=rp; let nh=CHARTDATA.length?CHARTDATA[CHARTDATA.length-1].HARI+1:1; CHARTDATA.push({HARI:nh, MASUK:0, TABUNG:rp, KELUAR:0}); if(CHARTDATA.length>100) CHARTDATA.shift(); SAVESTORAGE(); RENDERTOTALS(); RENDERGRAFIK(); r.value=''; CLOSEPOPUP('TABUNG'); }
    function DOKELUAR(){ let u=document.getElementById('KELUAR-UNTUK'); let r=document.getElementById('KELUAR-RP'); if(!u||!r) return; let untuk=u.value.trim().toUpperCase()||'TANPA NAMA'; let rp=parseInt(r.value)||0; if(rp<=0){ alert('RP. HARUS DIISI'); return;} if(rp>TOTALS.MASUK){ alert('SALDO MASUK TIDAK CUKUP'); return;} TOTALS.MASUK-=rp; TOTALS.KELUAR+=rp; BARANGMAP[untuk]=(BARANGMAP[untuk]||0)+rp; let nh=CHARTDATA.length?CHARTDATA[CHARTDATA.length-1].HARI+1:1; CHARTDATA.push({HARI:nh, MASUK:0, TABUNG:0, KELUAR:rp}); if(CHARTDATA.length>100) CHARTDATA.shift(); SAVESTORAGE(); RENDERTOTALS(); RENDERBARANG(); RENDERGRAFIK(); u.value=''; r.value=''; CLOSEPOPUP('KELUAR'); }
    window.addEventListener('load', ()=>{ LOADSTORAGE(); RENDERTOTALS(); RENDERBARANG(); RENDERGRAFIK(); let status=document.getElementById('OFFLINE-STATUS'); if(status){ if(navigator.onLine) status.textContent='ONLINE - DATA OTOMATIS TERSIMPAN DI LOCAL STORAGE'; else status.textContent='OFFLINE MODE - DATA TETAP TERSIMPAN'; } window.addEventListener('online', ()=>{ if(status) status.textContent='ONLINE KEMBALI - DATA AMAN'; }); window.addEventListener('offline', ()=>{ if(status) status.textContent='OFFLINE MODE - TETAP BISA DIPAKAI'; }); if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').then(()=>{console.log('SW OK')}).catch(e=>{console.log('SW FAIL',e)}); } });
  </script>
</body>
</html>
